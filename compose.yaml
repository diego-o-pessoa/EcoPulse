services:
  # Banco de Dados Principal com extensão PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ecopulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopulse_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecopulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecopulse_net

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ecopulse-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672" # Porta AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecopulse_net

  # Cache distribuído
  redis:
    image: redis:7.2-alpine
    container_name: ecopulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecopulse_net

  # Object Storage (Opcional, para simular S3)
  minio:
    image: quay.io/minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: ecopulse-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecopulse_net

  # API Gateway
  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.api
    container_name: ecopulse-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecopulse_net
    volumes:
      - ./backend:/app

  # Occurrence Worker
  occurrence-worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker
    command: ["python", "workers/occurrence/main.py"]
    container_name: ecopulse-occurrence-worker
    restart: always
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecopulse_net
    volumes:
      - ./backend:/app

  # Alert Worker
  alert-worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker
    command: ["python", "workers/alert/main.py"]
    container_name: ecopulse-alert-worker
    restart: always
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecopulse_net
    volumes:
      - ./backend:/app

  # Notification Worker
  notification-worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.worker
    command: ["python", "workers/notification/main.py"]
    container_name: ecopulse-notification-worker
    restart: always
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ecopulse_net
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:

networks:
  ecopulse_net:
    driver: bridge
